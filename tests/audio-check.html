<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Битоника — проверка звука</title>
  <style>body { font: 14px/1.5 system-ui, sans-serif; padding: 24px; background: #111; color: #bbfc9f; }</style>
</head>
<body>
  <h1>Проверка аудиосистемы</h1>
  <p>Нажмите кнопку — тест около 25 секунд измеряет каждый звук (громкость сайта лучше убавить).</p>
  <button id="run">Запустить проверку</button>
  <pre id="log"></pre>
  <script src="../js/vendor/tone-15.1.22.js"></script>
  <script type="module">
    import { runAudioCheck } from './audio-check.js';
    document.getElementById('run').addEventListener('click', () => runAudioCheck());
    window.runAudioCheck = runAudioCheck;
  </script>
</body>
</html>
